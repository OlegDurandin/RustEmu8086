name: Audit

# Known vulnerabilities in the dependencies (RustSec advisory database, `cargo audit`). Runs when
# the dependencies change and once a week, since new advisories appear for unchanged code too.
on:
  push:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; unmaintained and yanked crates are only reported as warnings.
      - name: cargo audit
        run: cargo audit
