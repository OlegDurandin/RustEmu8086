[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rustemu-core = { path = "crates/rustemu-core" }
rustemu-asm = { path = "crates/rustemu-asm" }
rustemu-session = { path = "crates/rustemu-session" }
rustemu-ui = { path = "crates/rustemu-ui" }
# GUI (rustemu-ui, rustemu-desktop, rustemu-tablet)
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
