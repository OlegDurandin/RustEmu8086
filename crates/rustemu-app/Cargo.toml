[package]
name = "rustemu-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The application is a library with one entry point per platform:
#   macOS / Windows / Linux, iPadOS - the `RustEmu8086` executable (src/main.rs);
#   Android                         - `android_main` in src/lib.rs, built as a cdylib.
[lib]
name = "rustemu_app"
path = "src/lib.rs"
# Android loads a shared library. It is not listed here (`crate-type = ["cdylib"]`) so that desktop
# builds do not link one; build it with the crate type given on the command line, e.g.
#   cargo ndk -t arm64-v8a rustc -p rustemu-app --lib --release --crate-type cdylib

[[bin]]
name = "RustEmu8086"
path = "src/main.rs"

# ---- all platforms --------------------------------------------------------------------------------
[dependencies]
rustemu-core.workspace = true
rustemu-asm.workspace = true
rustemu-session.workspace = true
# wgpu renderer everywhere: Metal on macOS and iPadOS, Vulkan / GLES on Android (eframe on iOS
# supports only wgpu, so the desktop uses the same renderer).
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }

# ---- desktop: macOS (Windows / Linux should work too) --------------------------------------------
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# System clipboard for Cmd+C / Cmd+V (arboard does not support iOS; egui-winit has none on Android).
eframe = { version = "0.37", default-features = false, features = ["clipboard"] }
# Native open / save dialogs; not available on iOS / Android (see src/platform.rs).
rfd = "0.17"

# ---- iPadOS (future) --------------------------------------------------------------------------------
# Built for aarch64-apple-ios and packaged with Xcode or `cargo bundle`; the executable starts
# eframe like on the desktop. To do in src/platform.rs: UIDocumentPickerViewController for files,
# UIPasteboard for the clipboard (objc2-ui-kit).
[target.'cfg(target_os = "ios")'.dependencies]

# ---- Android (future) -------------------------------------------------------------------------------
# NativeActivity: `android_main` receives the AndroidApp handle. To do in src/platform.rs: Storage
# Access Framework for files and ClipboardManager through JNI (`jni` crate).
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
