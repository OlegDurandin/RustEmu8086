[package]
name = "rustemu-tablet"
version.workspace = true
edition.workspace = true
license.workspace = true

# The tablet layout: a top bar with the run controls, Editor / Debugger / Memory tabs of fixed
# cards, an on-screen PC keyboard, in a dark theme sized for touch; drawn around the shared GUI of
# rustemu-ui. The web version (rustemu-web) uses it on iPads and touch screens;
# `cargo run -p rustemu-tablet` shows it in a desktop window (for development).
[lib]
name = "rustemu_tablet"
path = "src/lib.rs"

[[bin]]
name = "rustemu-tablet"
path = "src/main.rs"

[dependencies]
rustemu-core.workspace = true
rustemu-session.workspace = true
rustemu-ui.workspace = true
eframe = { workspace = true }
egui = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
rustemu-ui = { workspace = true, features = ["testing"] }
