<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="8086 assembler, emulator and debugger in the browser, compatible with Emu8086 programs">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1220">
  <title>RustEmu8086</title>
  <link data-trunk rel="rust" data-bin="rustemu-web" data-wasm-opt="z">
  <link data-trunk rel="icon" href="assets/icon-256.png">
  <link data-trunk rel="copy-file" href="assets/icon-256.png">
  <link rel="apple-touch-icon" href="icon-256.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; }
    /* eframe sizes the canvas to its parent. */
    #rustemu_canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
    #rustemu_status {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #d8e0ec; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="rustemu_canvas"></canvas>
  <div id="rustemu_status">Loading RustEmu8086…</div>
</body>
</html>
